<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account</title>

  <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: rgba(0, 89, 255, 0.918); color: white;">
    <a href="home.html" style="text-decoration: none; color: navy; font-weight: 900; padding: 10px;">Home</a>
    <div class="loginmessage">
      <h2>Welcome to </h2>
      <img src="image/file_0000000010f481f4a05668dbc23185f1.png" alt="img">
    </div>
  <div class="auth-container">

    <div class="auth-box">

      <h1>Create Account</h1>

      <p>Open your account</p>

      <form id="signupForm">

        <input
          type="text"
          name="name"
          placeholder="Full name"
          required
        >

        <input
          type="email"
          name="email"
          placeholder="Email"
          required
        >

        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        >
        
        

        <button type="submit">
          Sign Up
        </button>

      </form>

      <p id="message"></p>

      <p>
        Already have an account?
        <a href="home.html">click login</a>
      </p>

    </div>

  </div>

  <script src="./js/signup.js"></script>

</body>

</html>
